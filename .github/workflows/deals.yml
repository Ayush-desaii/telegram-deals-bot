name: 🛍️ Daily Amazon Deals Bot

on:
  # ── Run once daily at 9:00 AM IST (3:30 AM UTC) ───────────
  schedule:
    - cron: '30 3 * * *'

  # ── Manual trigger from GitHub Actions UI ─────────────────
  workflow_dispatch:

jobs:
  post-deals:
    name: Fetch & Post Amazon Deals
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: deals_bot/requirements.txt

      - name: 📦 Install Dependencies
        run: pip install -r deals_bot/requirements.txt

      - name: 🔐 Create .env from GitHub Secrets
        run: |
          cat > deals_bot/.env << 'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_AFFILIATE_TAG=${{ secrets.AMAZON_AFFILIATE_TAG }}
          FETCH_INTERVAL_MINUTES=1440
          MIN_DISCOUNT_PERCENT=40
          MAX_DEALS_PER_CYCLE=5
          EOF

      - name: 🗄️ Restore Deals Database (avoid duplicate posts)
        uses: actions/cache@v4
        with:
          path: deals_bot/deals_bot.db
          key: deals-db-${{ github.run_number }}
          restore-keys: |
            deals-db-

      - name: 🚀 Run Deals Bot
        run: |
          cd deals_bot
          python -X utf8 main.py --now
        env:
          PYTHONIOENCODING: utf-8

      - name: 💾 Save Database Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: deals_bot/deals_bot.db
          key: deals-db-${{ github.run_number }}
