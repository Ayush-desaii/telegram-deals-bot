name: Verified Amazon Deals

on:
  schedule:
    - cron: '30 3 * * *' # 09:00 IST
    - cron: '0 8 * * *'  # 13:30 IST
    - cron: '0 15 * * *' # 20:30 IST
  workflow_dispatch:
    inputs:
      mode:
        description: Preview never posts or saves production state
        type: choice
        options: [preview, post]
        default: preview

permissions:
  contents: read

concurrency:
  group: deals-production
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deals_bot/requirements.txt
      - run: pip install -r deals_bot/requirements.txt
      - run: python -m unittest discover -s deals_bot/tests -v

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deals_bot/requirements.txt
      - run: pip install -r deals_bot/requirements.txt
      - name: Restore legacy cache for bootstrap only
        uses: actions/cache/restore@v4
        with:
          path: deals_bot/deals_bot.db
          key: deals-db-preview-${{ github.run_id }}
          restore-keys: deals-db-
      - name: Verify production sources without posting
        run: python -u deals_bot/main.py --test --git-state --require-verified
        env:
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          MIN_DISCOUNT_PERCENT: '40'
          MAX_DEALS_PER_CYCLE: '2'
      - name: Validate production settings without contacting Telegram
        working-directory: deals_bot
        run: python -c "import config; raise SystemExit(0 if config.validate_config() else 1)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}

  post:
    if: >-
      github.ref == 'refs/heads/main' && vars.DEALS_APPROVED_SHA == github.sha &&
      (github.event_name == 'schedule' || inputs.mode == 'post')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deals_bot/requirements.txt
      - run: pip install -r deals_bot/requirements.txt
      - name: Restore legacy cache for bootstrap only
        uses: actions/cache/restore@v4
        with:
          path: deals_bot/deals_bot.db
          key: deals-db-bootstrap-${{ github.run_id }}
          restore-keys: deals-db-
      - name: Fetch, verify, and post with durable state
        run: python -u deals_bot/main.py --now --git-state
        env:
          DB_PATH: ${{ runner.temp }}/deals-state.sqlite
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          DEALS_APPROVED_SHA: ${{ vars.DEALS_APPROVED_SHA }}
          MIN_DISCOUNT_PERCENT: '40'
          MAX_DEALS_PER_CYCLE: '2'
