name: Deals Tests
on:
  push:
    branches: [main, 'codex/**']
    paths: ['deals_bot/**', '.github/workflows/deals*.yml']
  pull_request:
    paths: ['deals_bot/**', '.github/workflows/deals*.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deals_bot/requirements.txt
      - run: pip install -r deals_bot/requirements.txt
      - run: python -m unittest discover -s deals_bot/tests -v
